#cloud-config
# First boot of the server: Docker with Compose, ports 80 and 443 open in the host firewall (Oracle's Ubuntu images
# reject everything but SSH in iptables, on top of the VCN's security list), automatic security updates, and swap.
package_update: true
package_upgrade: false
packages:
  - docker.io
  - docker-compose-v2
  - unattended-upgrades
  - iptables-persistent
runcmd:
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  - iptables -I INPUT 1 -p tcp -m state --state NEW --dport 80 -j ACCEPT
  - iptables -I INPUT 1 -p tcp -m state --state NEW --dport 443 -j ACCEPT
  - netfilter-persistent save
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - mkdir -p /opt/app && chown ubuntu:ubuntu /opt/app
